[project]
name = "boba-joints"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "duckdb>=1.5.5",
    "geoalchemy2>=0.20.0",
    "geopandas>=1.1.4",
    "overturemaps>=1.0.2",
    "pandera[pandas]>=0.33.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boba"]

[dependency-groups]
dashboard = [
    "plotly>=7.0.0",
    "streamlit>=1.63.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]
notebooks = [
    "jupyterlab>=4.6.3",
    "jupytext>=1.19.5",
    "mapclassify>=2.11.0",
    "matplotlib>=3.11.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "E501", "B018"]
# Alembic template boilerplate: unused `sa` import, Union[] typing
"migrations/versions/*" = ["E501", "F401", "I001", "UP007", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
